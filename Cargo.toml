[package]
name = "amamo-mdx-native"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "native/src/lib.rs"

[dependencies]
blake3 = "1.8.7"
jsonschema = { version = "0.49.9", default-features = false }
markdown = "1.0.0"
mdxjs = "1.0.4"
napi = { version = "3.16.3", default-features = false, features = ["napi8"] }
napi-derive = "3.7.2"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
roxmltree = "0.21.2"
serde = { version = "=1.0.224", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
swc_core = { version = "27.0.6", features = ["common", "ecma_ast", "ecma_visit"] }
unicode-general-category = "1.1.0"
yaml_serde = "0.10.7"
zstd = { version = "0.13.3", default-features = false }

[build-dependencies]
napi-build = "2.7.0"

[profile.release]
lto = true
strip = "symbols"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
default_trait_access = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
